
services:
  web:
    image: php:8.1-apache
    container_name: udo_web
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/var/www/html
    # Enable Apache mod_rewrite for nice URLs
    command: sh -c "a2enmod rewrite headers && apache2-foreground"
    depends_on:
      - db
    networks:
      - udo_network

  db:
    image: mariadb:10.6.13
    container_name: udo_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: udo_db
      MYSQL_USER: udo_user
      MYSQL_PASSWORD: udo_password
    ports:
      - "3306:3306"
    volumes:
      - udo_db_data:/var/lib/mysql
    networks:
      - udo_network

volumes:
  udo_db_data:

networks:
  udo_network:
