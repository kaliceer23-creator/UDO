<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>รายละเอียดสินค้า - UDO</title>
    <!-- Prompt Font for Windows fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
    <style id="fouc-fix">
      /* Prevent FOUC (Flash of Unstyled Content) for SVGs */
      svg:not([class*="w-"]) { max-width: 40px; max-height: 40px; }
    </style>
  </head>
  <body class="bg-white font-['Prompt',sans-serif] antialiased text-gray-900 selection:bg-[#8fc101] selection:text-white pb-[80px] md:pb-0">
    <div id="app">

    
    <!-- 1. Nav Component (โหลดจากไฟล์ศูนย์รวม) -->
  <load src="./src/components/nav.html" />

  <!-- 3. พื้นที่เนื้อหาหลัก (Main Content) -->
  <!-- Breadcrumb -->
    <div class="bg-white">
      <div class="max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12">
        <div id="product-breadcrumb-container" class="border-b border-gray-200 pt-3.5 pb-3 text-[15px] font-normal text-gray-700 flex items-center gap-4 overflow-x-auto whitespace-nowrap">
          <a href="/" class="hover:text-[#8ac353] hover:underline hover:underline-offset-2">หน้าหลัก</a>
          <span class="text-gray-400">&gt;</span>
          <a href="/category.html?cat=cat-12" class="hover:text-[#8ac353] hover:underline hover:underline-offset-2">กลุ่มลวดเชื่อม</a>
          <span class="text-gray-400">&gt;</span>
          <span class="text-[#252525]">รายละเอียดสินค้า</span>
        </div>
      </div>
    </div>

    <main class="bg-white min-h-screen pt-6 md:pt-8">
      <div class="max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12 pb-20 lg:pb-24">
        
        <div class="flex flex-col lg:flex-row justify-start items-start gap-4 lg:gap-5 xl:gap-6">
          
          <!-- LEFT COLUMN: Central Style Image Gallery (57-58% width) -->
          <div class="w-full lg:w-[57%] xl:w-[58%] lg:sticky lg:top-36 lg:self-start">
            <div class="flex flex-col-reverse sm:flex-row items-center sm:items-start gap-4 md:gap-6">
              
              <!-- 1. Vertical Thumbnail Strip (ฝั่งซ้าย พร้อมปุ่มลูกศรขึ้น-ลง) -->
              <div id="product-thumbnails-wrapper" class="flex sm:flex-col items-center gap-2.5 shrink-0 select-none">
                <!-- Up Button (↑) -->
                <button type="button" id="btn-thumb-prev" onclick="window.scrollThumbnails(-1)" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-gray-300 hover:border-black bg-white hover:bg-gray-50 text-gray-800 hover:text-black flex items-center justify-center transition-all cursor-pointer shrink-0" aria-label="เลื่อนรูปขึ้น">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-6 6m6-6l6 6" />
                  </svg>
                </button>

                <!-- Thumbnails List Container (Aligned with main image) -->
                <div id="product-thumbnails-container" class="flex sm:flex-col gap-3 sm:gap-3.5 overflow-x-auto sm:overflow-y-auto no-scrollbar max-w-[85vw] sm:max-w-none sm:max-h-[460px] md:max-h-[480px] lg:max-h-[500px] py-1 px-1">
                  <!-- Dynamically populated by JS -->
                </div>

                <!-- Down Button (↓) -->
                <button type="button" id="btn-thumb-next" onclick="window.scrollThumbnails(1)" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-gray-300 hover:border-black bg-white hover:bg-gray-50 text-gray-800 hover:text-black flex items-center justify-center transition-all cursor-pointer shrink-0" aria-label="เลื่อนรูปลง">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m0 0l6-6m-6 6l-6-6" />
                  </svg>
                </button>
              </div>

              <!-- 2. Main Product Image (ฝั่งขวา พร้อมปุ่มลูกศรซ้าย-ขวา และ SKU ด้านล่างแบบชิดรูป) -->
              <div class="flex-1 w-full flex flex-col items-center">
                <div class="relative w-full aspect-square bg-white flex items-center justify-center group overflow-hidden">
                  <img id="product-image" src="/images/bg-welding.jpeg" alt="Product" class="w-full h-full object-contain p-0 transform scale-[0.72] origin-center cursor-zoom-in transition-all duration-300">
                  
                  <!-- Main Image Left Arrow (←) -->
                  <button type="button" id="btn-main-prev" onclick="window.navigateImage(-1)" class="absolute left-2 md:left-4 top-1/2 -translate-y-1/2 w-10 h-10 md:w-11 md:h-11 rounded-full bg-white border border-gray-300 hover:border-black flex items-center justify-center text-gray-800 hover:text-black transition-all cursor-pointer z-10" aria-label="รูปภาพก่อนหน้า">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 md:w-6 md:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6 6m-6-6l6-6" />
                    </svg>
                  </button>

                  <!-- Main Image Right Arrow (→) -->
                  <button type="button" id="btn-main-next" onclick="window.navigateImage(1)" class="absolute right-2 md:right-4 top-1/2 -translate-y-1/2 w-10 h-10 md:w-11 md:h-11 rounded-full bg-white border border-gray-300 hover:border-black flex items-center justify-center text-gray-800 hover:text-black transition-all cursor-pointer z-10" aria-label="รูปภาพถัดไป">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 md:w-6 md:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m0 0l-6-6m6 6l-6 6" />
                    </svg>
                  </button>
                </div>

                <!-- SKU Code Centered Below Main Image (Right directly under the image) -->
                <div id="product-sku" class="mt-2 text-center text-[14px] sm:text-[15px] text-[#252525] font-normal tracking-wide">
                </div>
              </div>

            </div>
          </div>

          <!-- RIGHT COLUMN: Details (Reduced width to 36-38%, max-w-[480px]) -->
          <div class="w-full lg:w-[38%] xl:w-[36%] max-w-[480px]">
            <!-- 1. ชื่อสินค้า (Product Title) -->
            <h1 id="product-name" class="text-[21px] sm:text-[22px] md:text-[23px] font-semibold text-[#160808] leading-[1.35] tracking-tight block transform scale-y-[1.035] origin-top-left mb-6"></h1>

            <!-- 2. ราคา (Price Section - Central Style) -->
            <div id="product-price-section" class="mb-6 flex flex-col items-start">
              <!-- Badges Row (Discount % & New Tag side-by-side like Central Department Store) -->
              <div id="product-badges-row" class="flex items-center gap-2 mb-2.5" style="display:none;">
                <!-- Tag ลดราคา (Discount Badge - Solid Black matching Card) -->
                <div id="product-discount-badge" class="bg-[#000000] text-white text-[15px] font-semibold px-2 py-0.5 rounded-[4px] leading-tight select-none tracking-tight flex items-center justify-center" style="display:none;">
                  <span class="inline-block transform scale-y-[1.08] origin-center font-semibold"></span>
                </div>

                <!-- Tag ใหม่ (New Badge - Exactly matching Product Card) -->
                <div id="product-badge-new" class="bg-[#f2f2f2] text-[#160808] text-[15px] font-bold px-2 py-0.5 rounded-[4px] leading-tight select-none tracking-tight flex items-center justify-center" style="display:none;">
                  <span class="inline-block transform scale-y-[1.05] origin-center">ใหม่</span>
                </div>
              </div>

              <!-- Pricing Row (Original Red #FF3B30 for both Price and Save text) -->
              <div class="flex items-baseline gap-2.5 sm:gap-3 flex-wrap">
                <div class="flex items-baseline gap-1.5">
                  <div id="product-price" class="text-[26px] sm:text-[28px] md:text-[30px] font-semibold text-[#FF3B30] leading-none tracking-tight inline-block transform scale-y-[1.08] origin-bottom"></div>
                  <span id="product-unit" class="text-black/50 text-[14px] font-normal" style="display:none;"></span>
                </div>
                <div id="product-original-price" class="text-[16px] sm:text-[17px] text-[#a6a0a0] line-through decoration-[#a6a0a0] font-normal inline-block transform scale-y-[1.08] origin-bottom tracking-tight" style="display:none;"></div>
                <div id="product-savings" class="text-[15px] sm:text-[16px] text-[#FF3B30] font-normal inline-block transform scale-y-[1.08] origin-bottom tracking-tight" style="display:none;"></div>
              </div>

              <!-- Installment / Warranty -->
              <div id="product-warranty" class="flex items-center gap-2 mt-2.5 text-[13px] text-black/60" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-black/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                รับประกัน 1 ปี
              </div>
            </div>

            <!-- 3. รายละเอียด (Description) -->
            <p id="product-desc" class="text-[18px] text-[#333] font-normal leading-[1.6] mb-6"></p>

            <!-- 4. ขนาด (Size & Packaging Section) -->
            <div class="space-y-5">
              <!-- Size Section (ขนาด:) -->
              <div id="size-section-wrapper">
                <div class="flex items-baseline gap-2 mb-3">
                  <span class="text-[15px] font-bold text-[#333]">ขนาด:</span>
                  <span id="selected-size-label" class="text-[15px] font-normal text-[#333]"></span>
                </div>
                <div class="flex flex-wrap items-center gap-2.5" id="size-buttons">
                  <!-- Buttons will be injected by JS -->
                </div>
              </div>

              <!-- Packaging (บรรจุ:) -->
              <div id="package-section-wrapper">
                <div class="flex items-baseline gap-2 mb-3">
                  <span class="text-[15px] font-bold text-[#333]">บรรจุ:</span>
                  <span id="selected-package-label" class="text-[15px] font-normal text-[#333]"></span>
                </div>
                <div class="flex flex-wrap items-center gap-2.5" id="package-buttons">
                  <!-- Buttons will be injected by JS -->
                </div>
              </div>
            </div>

            <!-- Action Button & Wishlist (Central Style - Balanced prominence) -->
            <div class="flex items-center gap-3 mt-9 sm:mt-10 lg:mt-11 mb-8">
              <!-- Main CTA Button with 2-Side Curtain Reveal Hover Effect (Reduced height to 46px) -->
              <a href="https://line.me/R/ti/p/@udothai" target="_blank" rel="noopener noreferrer" id="btn-main-action" class="group relative overflow-hidden flex-1 bg-brand-green h-[46px] rounded-[2px] flex items-center justify-center tracking-wide select-none">
                <!-- Left Curtain Panel (Black) -->
                <span class="absolute top-0 left-0 w-1/2 h-full bg-black transition-transform duration-300 ease-out group-hover:-translate-x-full"></span>
                <!-- Right Curtain Panel (Black) -->
                <span class="absolute top-0 right-0 w-1/2 h-full bg-black transition-transform duration-300 ease-out group-hover:translate-x-full"></span>
                <!-- Button Text (White normally, Black when curtains open like nav) -->
                <span class="relative z-10 font-normal text-[15px] sm:text-[16px] text-white group-hover:text-black transition-colors duration-300">
                  สั่งซื้อ / สอบถามทาง LINE
                </span>
              </a>
              
              <!-- Heart Button (Wishlist - Proportional 46px square) -->
              <button type="button" id="btn-product-heart" onclick="window.toggleFavorite()" class="w-[46px] h-[46px] border-[1.5px] border-gray-400 rounded-[2px] flex items-center justify-center text-[#252525] shrink-0 cursor-pointer" aria-label="เพิ่มเป็นรายการโปรด">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[24px] h-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
              </button>
            </div>


          </div>

        </div>
      </div>



      <!-- Specs Section -->
      <div class="w-full bg-[#F5F5F5] py-16 border-b border-gray-200">
        <div class="max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12">
          <h2 class="text-[22px] font-bold text-[#252525] mb-6">รายละเอียดสินค้า</h2>
          
          <div id="product-specs-container" class="w-full flex flex-col text-[16px] text-[#252525]">
            <!-- JS will inject specs here -->
          </div>
        </div>
      </div>
      <!-- End of Specs Section -->
      <!-- Rich Content (A+ Content) Section -->
      <div class="w-full bg-white pt-16 pb-0 relative">
        <div id="rich-content-container" class="max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12 text-center relative overflow-hidden transition-[max-height] duration-500 ease-in-out max-h-[300px]">
          
          <!-- Headline -->
          <h3 id="rich-headline" class="text-[24px] font-semibold text-[#252525] mb-4"></h3>
          
          <!-- Feature Text Block -->
          <div class="mb-8">
            <h4 id="rich-subheadline" class="text-[19px] font-semibold text-[#252525] mb-4 hidden"></h4>
            <p id="rich-desc" class="text-[16px] text-[#252525] leading-relaxed w-full mx-auto whitespace-pre-line"></p>
          </div>

          <!-- Engineering Specs Tables (Chemical, Mechanical, Current Range) -->
          <div id="rich-engineering-tables" class="w-full text-left my-8 space-y-6"></div>
          
          <!-- Image 1 -->
          <div class="w-full max-w-[800px] mx-auto mb-10 flex justify-center px-2 sm:px-0" style="display:none;">
            <img id="rich-img-1" src="" alt="Product Detail 1" class="max-w-full h-auto object-contain rounded-xl mx-auto">
          </div>
          
          <!-- Image 2 -->
          <div class="w-full max-w-[800px] mx-auto mb-8 flex justify-center px-2 sm:px-0" style="display:none;">
            <img id="rich-img-2" src="" alt="Product Detail 2" class="max-w-full h-auto object-contain rounded-xl mx-auto">
          </div>
          
          <!-- Image 3 -->
          <div class="w-full max-w-[800px] mx-auto mb-6 flex justify-center px-2 sm:px-0" style="display:none;">
            <img id="rich-img-3" src="" alt="Product Detail 3" class="max-w-full h-auto object-contain rounded-xl mx-auto">
          </div>
          
        </div>
        
        <!-- Fade & Read More -->
        <div id="rich-content-fade" class="absolute bottom-0 left-0 w-full h-[140px] bg-gradient-to-t from-white via-white/80 to-transparent flex items-end justify-center pb-0 pointer-events-none transition-all duration-300">
          <button id="btn-read-more" class="pointer-events-auto text-[#252525] font-semibold text-[16px] flex items-center gap-2 hover:text-brand-red transition-colors bg-white px-8 py-2.5 rounded-full shadow-[0_2px_15px_rgba(0,0,0,0.1)] border border-gray-100 translate-y-1/2 z-10">
            <span id="read-more-text">ดูรายละเอียดเพิ่มเติม</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform duration-300" id="read-more-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
        </div>
      </div>


    
      <!-- Similar Products Section (สินค้าที่คล้ายกัน - สไตล์เดียวกับสินค้าแนะนำ) -->
      <section class="w-full bg-[#F7F6F4] py-12 md:py-16">
        <div class="max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12">
          <!-- Header (Styled exactly like index.html) -->
          <div class="flex items-baseline justify-between mb-3 md:mb-4">
            <h2 class="text-[30px] font-semibold text-gray-900 tracking-[0.008em]">
              <span class="inline-block transform scale-y-[1.05] origin-bottom-left">สินค้าที่คล้ายกัน</span>
            </h2>
            <a id="related-view-all" href="/category.html" class="text-[16px] md:text-[18px] font-normal text-gray-900 hover:text-gray-600 underline underline-offset-4 transition-colors">
              ดูทั้งหมด
            </a>
          </div>

          <!-- Slider Wrapper (สไตล์เดียวกับ Slider ในหน้าแรก) -->
          <div class="relative w-full group/pslider pb-1">
            <div id="related-products-track" class="pslider-track flex items-stretch gap-3 md:gap-4 overflow-x-auto no-scrollbar pt-1 md:pt-2 pb-3 snap-x snap-mandatory">
              <!-- Injected by JS -->
            </div>

            <!-- Navigation Buttons -->
            <button type="button" class="pslider-prev absolute left-0 top-1/2 -translate-y-1/2 w-8 h-14 bg-black/25 hover:bg-black/35 text-white rounded-md z-10 transition-all flex items-center justify-center opacity-0 pointer-events-none" aria-label="ก่อนหน้า">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="0.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <button type="button" class="pslider-next absolute right-0 top-1/2 -translate-y-1/2 w-8 h-14 bg-black/25 hover:bg-black/35 text-white rounded-md z-10 transition-all flex items-center justify-center" aria-label="ถัดไป">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="0.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>
    <!-- 4. Footer & Floating UI (โหลดจากไฟล์ศูนย์รวม) -->
  <load src="./src/components/footer.html" />
  <load src="./src/components/floating-buttons.html" />
  <load src="./src/components/dock.html" />

    </div>
    <script type="module" src="/src/product.js"></script>
  </body>
</html>
