<!-- Sticky Sentinel: Detects when the category bar hits the viewport top -->
<div id="nav-sticky-sentinel" class="h-px w-full pointer-events-none -mb-px"></div>

<!-- 2. Sticky Category Bar (Article Categories with active solid-black badge) -->
<nav id="article-sticky-nav" class="sticky top-0 z-40 w-full bg-white/98 backdrop-blur-md">
  <div class="max-w-[1440px] mx-auto px-4 md:px-8">
    <div id="article-nav-inner" class="flex items-center justify-start md:justify-center gap-4 sm:gap-6 md:gap-7 overflow-x-auto no-scrollbar py-2.5 sm:py-3 text-[13px] sm:text-[14px] md:text-[14.5px] font-bold uppercase tracking-[0.05em] whitespace-nowrap">
      <a href="/articles.html?category=เทคนิคการเชื่อม" data-nav-cat="เทคนิคการเชื่อม" class="nav-cat-link px-3.5 py-1.5 rounded-[2px] transition-colors">เทคนิคการเชื่อม</a>
      <a href="/articles.html?category=เลือกใช้ลวดเชื่อม" data-nav-cat="เลือกใช้ลวดเชื่อม" class="nav-cat-link px-3.5 py-1.5 rounded-[2px] transition-colors">เลือกใช้ลวดเชื่อม</a>
      <a href="/articles.html?category=คู่มือ & ทริคช่าง" data-nav-cat="คู่มือ & ทริคช่าง" class="nav-cat-link px-3.5 py-1.5 rounded-[2px] transition-colors">คู่มือ & ทริคช่าง</a>
      <a href="/articles.html?category=ความปลอดภัย & มาตรฐาน" data-nav-cat="ความปลอดภัย & มาตรฐาน" class="nav-cat-link px-3.5 py-1.5 rounded-[2px] transition-colors">ความปลอดภัย & มาตรฐาน</a>
      <a href="/articles.html?category=ดูแลรักษาเครื่องมือ" data-nav-cat="ดูแลรักษาเครื่องมือ" class="nav-cat-link px-3.5 py-1.5 rounded-[2px] transition-colors">ดูแลรักษาเครื่องมือ</a>
      <a href="/articles.html?category=สาระวิศวกรรม" data-nav-cat="สาระวิศวกรรม" class="nav-cat-link px-3.5 py-1.5 rounded-[2px] transition-colors">สาระวิศวกรรม</a>
      <a href="/articles.html?category=TRENDING" data-nav-cat="TRENDING" class="nav-cat-link px-3.5 py-1.5 rounded-[2px] text-[#c5161b] font-extrabold hover:underline"># TRENDING</a>
    </div>
  </div>
</nav>

<style>
  #article-sticky-nav {
    border-bottom: 2px solid transparent !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #article-sticky-nav.is-sticky {
    border-bottom: 2px solid #160808 !important;
    box-shadow: 0 1px 4px 0 rgba(0, 0, 0, 0.06);
  }
  #article-nav-inner {
    border-bottom: 2px solid #160808;
    transition: border-color 0.15s ease;
  }
  #article-sticky-nav.is-sticky #article-nav-inner {
    border-bottom-color: transparent !important;
  }
  .nav-cat-link {
    color: #160808;
    background-color: transparent;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .nav-cat-link:hover {
    color: #c5161b;
  }
  .nav-cat-link.is-active {
    background-color: #160808 !important;
    color: #ffffff !important;
  }
</style>

<script>
  (function() {
    function initActiveNav() {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('category');
      if (cat) {
        document.querySelectorAll('.nav-cat-link').forEach(link => {
          if (link.getAttribute('data-nav-cat') === cat) {
            link.classList.add('is-active');
          } else {
            link.classList.remove('is-active');
          }
        });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initActiveNav);
    } else {
      initActiveNav();
    }
  })();
</script>
